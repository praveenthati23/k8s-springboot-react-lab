# -----------------------------------------------------------------------
# PersistentVolume - manually provisioned using hostPath on the worker
# node. We're not using a dynamic StorageClass/CSI driver here (that
# would normally mean installing the AWS EBS CSI driver and granting
# it IAM permissions) - for a 1-day lab, a hostPath PV backed by the
# worker's own disk is simpler and keeps IAM scope minimal. Tradeoff:
# data only survives as long as this specific EC2 instance does, and
# doesn't support multi-node scheduling flexibility. A real production
# cluster would use the EBS CSI driver for proper dynamic, portable
# storage.
# -----------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv-dev
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/postgres-dev
  claimRef:
    namespace: dev
    name: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: dev
type: Opaque
stringData:
  POSTGRES_DB: notesdb
  POSTGRES_USER: notesuser
  POSTGRES_PASSWORD: notespassword-dev
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: notesdb
  DB_USER: notesuser
  DB_PASSWORD: notespassword-dev
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dev
spec:
  clusterIP: None # headless service - gives the StatefulSet pod a stable DNS name
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dev
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres # avoids "lost+found" directory issues on hostPath mounts
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 250m
              memory: 350Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "notesuser"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
