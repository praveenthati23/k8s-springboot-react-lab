apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Placeholder tag - CI/CD overwrites this with the specific
          # git-sha-tagged image via `kubectl set image` on every deploy.
          # This baseline exists so the manifest is apply-able standalone.
          image: thatipraveen23/k8s-lab-backend:304
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: 150m
              memory: 300Mi
            limits:
              cpu: 400m
              memory: 450Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev
spec:
  # ClusterIP only - the backend is never exposed directly to the
  # internet. The frontend's nginx reverse-proxies to it internally,
  # which is the only path in.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
