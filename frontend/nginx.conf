server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router-style SPA fallback - any path that isn't a real file
    # falls back to index.html so client-side routing works. We don't
    # use client-side routing in this lab app, but it's the standard,
    # correct nginx config for any React SPA.
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy /api/* to the backend Kubernetes Service.
    # "backend" resolves via Kubernetes' internal DNS to whichever
    # namespace THIS pod is running in - so the exact same nginx.conf,
    # baked into the exact same image, correctly reaches the dev
    # backend when deployed in the dev namespace, and the prod backend
    # when deployed in the prod namespace. No per-environment rebuild,
    # no CORS (browser only ever talks to nginx, same-origin).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
